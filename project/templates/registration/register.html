{% extends 'classreg/navbar.html' %}
{% block nav_block %}
<section class="container my-5">
    <h1 class="fw-bold text-center mb-5">Parent Registration</h1>
    <div class="w-25 mx-auto">
        <form method="POST">
            {% csrf_token %}
            {% for i in form %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ i.label }}</label><br>
                    {{ i }}
                </div>
            {% endfor %}
            <input type="submit" class="btn btn-primary my-3 mx-auto d-block" value="Register">
        </form>
    </div>
</section>
{% endblock %}

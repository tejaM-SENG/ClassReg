
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>

<body>

<header>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">

        <!-- Brand -->
        <a class="navbar-brand m-0 p-0 px-2" href="/">
            <img src="{% static 'images/logo.jpg' %}" alt="Logo" width="150" height="75" class="d-inline-block align-text-top" />
        </a>

        <!-- Mobile Toggler -->
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Content -->
        <div class="collapse navbar-collapse ps-5" id="navbarSupportedContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/about">
                        About Us
                    </a>
                </li>

                <!-- Dropdown -->
                <li class="nav-item dropdown">

                    <a
                        class="nav-link dropdown-toggle"
                        href="#"
                        id="navbarDropdown"
                        role="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                    >
                        Classes
                    </a>

                    <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <li>
                            <a class="dropdown-item" href="/python">Python</a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="/java">
                                Java
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="/django">
                                DJango
                            </a>
                        </li>
                    </ul>

                </li>

                <li class="nav-item dropdown">

                    <a
                        class="nav-link dropdown-toggle"
                        href="#"
                        id="navbarDropdown"
                        role="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                    >
                        Gallery
                    </a>

                    <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <li>
                            <a class="dropdown-item" href="/photos">
                                Photos
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="/videos">
                                Videos
                            </a>
                        </li>
                    </ul>

                </li>
                <li>
                    <a class="nav-link" href="/news">
                        Latest News
                    </a>
                </li>
                <li>
                    <a class="nav-link" href="/contact">
                        Contact Us
                    </a>
                </li>
                <li>
                    <a class='nav-link' href='/dashboard'>
                        Dashboard
                    </a>
                </li>

            </ul>

            <!-- Search -->
            <div class="d-flex">
                {% comment %} <a href='/login'>
                <button
                    class="btn btn-outline-primary me-2"
                    type="submit"
                >
                    Login
                </button>
                </a> {% endcomment %}
                <a href='/register'>
                <button
                    class="btn btn-outline-danger" type='submit' href="/register">
                    Register
                </button>
            </a>

        </div>

        </div>

    </div>
</nav>

</header>

{% block nav_block %}
{% endblock %}



</body>
</html>
